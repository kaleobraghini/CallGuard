name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Opcional: chave fixa nos segredos do repositório (permite atualizar o app por cima).
      - name: Preparar keystore (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/callguard.jks"
            echo "CALLGUARD_KEYSTORE=$RUNNER_TEMP/callguard.jks" >> "$GITHUB_ENV"
          fi

      - name: Testes do motor de bloqueio
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        env:
          CALLGUARD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CALLGUARD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CALLGUARD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CallGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-apk
          path: out/CallGuard.apk

      # Cada envio para a main vira uma versão nova em Releases.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: CallGuard v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/CallGuard.apk
