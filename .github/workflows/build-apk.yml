name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: assinatura com chave própria (recomendado para poder atualizar sem desinstalar).
      # Crie os segredos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD no repositório.
      - name: Preparar keystore (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/callguard.jks"
            echo "CALLGUARD_KEYSTORE=$RUNNER_TEMP/callguard.jks" >> "$GITHUB_ENV"
          fi

      - name: Testes unitários
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APKs
        env:
          CALLGUARD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CALLGUARD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CALLGUARD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CallGuard.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/CallGuard-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-apk
          path: out/*.apk

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

  # Testes de integração (Room + motor de decisão) em um emulador Android.
  # Roda quando acionado manualmente (Actions > Build APK > Run workflow) ou em tags v*.
  instrumented-tests:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew --no-daemon connectedDebugAndroidTest
